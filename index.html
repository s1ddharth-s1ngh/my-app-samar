<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <title>Samar</title>
    <script>
      let preference = 'system';
      try {
        preference = localStorage.getItem('samar-theme') || 'system';
      } catch {}
      const dark =
        preference === 'dark' ||
        (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      const theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.add(theme);
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = dark ? '#000000' : '#f5f5f5';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
